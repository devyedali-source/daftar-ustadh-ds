name: Book packs test (local testing)

# يدوي فقط: يختبر تنزيل الكتب حسب اختيار الأستاذ بنظام المتجر نفسه في وضع الاختبار المحلي
# (bundletool --local-testing) على محاكي أندرويد 10 (أندرويد 11 يمنع bundletool من نسخ الحزم)، ويضع لقطات صفحة «كتبي على الهاتف» في فرع book-packs-shots.
on:
  workflow_dispatch:
  push:
    branches: [run-book-packs-test]

permissions:
  contents: write

jobs:
  packs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Check book packs index
        run: python3 tools/books/packs.py check
      - name: Build teacher bundle + test APK
        run: gradle bundleTeacherDebug assembleTeacherDebugAndroidTest --no-daemon -PstoreShots
      - name: bundletool (local testing)
        run: |
          curl -sSL -o bundletool.jar https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar
          ls app/build/outputs/bundle/teacherDebug/
          java -jar bundletool.jar build-apks --bundle=app/build/outputs/bundle/teacherDebug/app-teacher-debug.aab \
            --output=teacher.apks --local-testing \
            --ks=app/debug.keystore --ks-pass=pass:android --ks-key-alias=androiddebugkey --key-pass=pass:android
          ls -la teacher.apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: Nexus 5X
          disable-animations: true
          disk-size: 4096M
          script: |
            java -jar bundletool.jar install-apks --apks=teacher.apks
            adb install -r -t app/build/outputs/apk/androidTest/teacher/debug/app-teacher-debug-androidTest.apk
            adb shell am instrument -w -e class com.elyedali.daftarustadh.BookPacksTest com.elyedali.daftarustadh.teacher.test/androidx.test.runner.AndroidJUnitRunner | tee result.txt
            mkdir -p out && for f in books-1-chosen books-2-extra books-3-removed; do adb exec-out run-as com.elyedali.daftarustadh.teacher cat files/store/$f.png > out/$f.png || true; done; ls -la out
            grep -q "^OK (1 test)" result.txt
      - name: Push screenshots
        if: always()
        run: |
          mkdir -p out && cp result.txt out/ 2>/dev/null || true
          git config user.name "packs-bot"
          git config user.email "packs-bot@users.noreply.github.com"
          git checkout --orphan book-packs-shots
          git rm -rf --cached . > /dev/null
          cp out/* .
          git add *.png result.txt 2>/dev/null || git add result.txt
          git commit -m "Book packs test" || true
          git push -f origin book-packs-shots
