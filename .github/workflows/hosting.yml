name: نشر موقع دفتر الأستاذ (daftar-ustadh.web.app)

# يُشغَّل يدويًا فقط (لا علاقة له ببناء التطبيق)
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: moctar-gratuit
          channelId: live
          target: ds
          entryPoint: hosting
