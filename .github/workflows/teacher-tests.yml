name: Teacher app tests (emulator)

# يدوي فقط: يشغّل اختبار شاشات تطبيق الأستاذ المذكور في .github/test-class على محاكي،
# ويضع اللقطات والنتيجة في فرع teacher-tests-out.
on:
  push:
    branches: [run-teacher-tests]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: Nexus 5X
          disable-animations: true
          script: |
            if [ -s .github/test-class ]; then gradle connectedTeacherDebugAndroidTest --no-daemon -PstoreShots -Pandroid.testInstrumentationRunnerArguments.class=com.elyedali.daftarustadh.$(cat .github/test-class) -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true > result.txt 2>&1 || echo FAILED >> result.txt; fi
            mkdir -p out && for f in $(adb shell run-as com.elyedali.daftarustadh.teacher ls files/store | tr -d '\r'); do adb exec-out run-as com.elyedali.daftarustadh.teacher cat files/store/$f > out/$f || true; done; ls -la out
            if [ -s .github/test-admin-class ]; then gradle connectedAdminDebugAndroidTest --no-daemon -PstoreShots -Pandroid.testInstrumentationRunnerArguments.class=com.elyedali.daftarustadh.$(cat .github/test-admin-class) -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true > result-admin.txt 2>&1 || echo FAILED >> result-admin.txt; fi
            if [ -s .github/test-admin-class ]; then mkdir -p out/admin && for f in $(adb shell run-as com.elyedali.daftarustadh ls files/store | tr -d '\r'); do adb exec-out run-as com.elyedali.daftarustadh cat files/store/$f > out/admin/$f || true; done; ls -la out/admin; fi
      - name: Push results
        if: always()
        run: |
          mkdir -p out && cp result.txt result-admin.txt out/ 2>/dev/null || true
          cp -r app/build/outputs/androidTest-results/connected out/connected 2>/dev/null || true
          git config user.name "tests-bot"
          git config user.email "tests-bot@users.noreply.github.com"
          git checkout --orphan teacher-tests-out
          git rm -rf --cached . > /dev/null
          find . -mindepth 1 -maxdepth 1 ! -name out ! -name .git -exec rm -rf {} +
          cp -r out/* . && rm -rf out
          git add -A
          git commit -m "Teacher tests" || true
          git push -f origin teacher-tests-out
          cat result*.txt | grep -q "FAILED" && exit 1 || true
