name: Store screenshots (admin)

# يدوي فقط: لقطات متجر «إدارة DS» من الشاشات الحقيقية على محاكي، وتوضع في فرع store-screens
on:
  workflow_dispatch:
  push:
    branches: [run-store-screens]

permissions:
  contents: write

jobs:
  screens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: Nexus 5X
          disable-animations: true
          script: |
            gradle connectedAdminDebugAndroidTest --no-daemon -Pandroid.testInstrumentationRunnerArguments.class=com.elyedali.daftarustadh.StoreScreens -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true
            mkdir -p out && for f in 1-institution 2-results 3-grades 4-kashf; do adb exec-out run-as com.elyedali.daftarustadh cat files/store/$f.png > out/$f.png; done; ls -la out
      - name: Push screenshots
        run: |
          git config user.name "screens-bot"
          git config user.email "screens-bot@users.noreply.github.com"
          git checkout --orphan store-screens
          git rm -rf --cached . > /dev/null
          cp out/*.png .
          git add *.png
          git commit -m "Store screenshots"
          git push -f origin store-screens
